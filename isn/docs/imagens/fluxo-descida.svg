<text x="1120" y="1496" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Na primeira etapa: George recusa;</text>
<text x="1120" y="1516" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">buscar ReForge</text>
