<text x="260" y="1306" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Registrar retry usado; reiniciar</text>
<text x="260" y="1326" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">setor</text>
<rect x="962" y="696" width="316" height="88" rx="12" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="1120" y="736" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Primeira retirada: George recusa</text>
<text x="1120" y="756" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">ajudar</text>
<rect x="962" y="886" width="316" height="88" rx="12" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="1120" y="926" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">ReForge: retirar implante e</text>
<text x="1120" y="946" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">bioprintar</text>
<rect x="962" y="1076" width="316" height="88" rx="12" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="1120" y="1116" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Salvar retirada, corpo e</text>
<text x="1120" y="1136" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">habilidade</text>
<polygon points="1120,1244 1278,1310 1120,1376 962,1310" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="1120" y="1316" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Quatro retiradas?</text>
<rect x="962" y="1456" width="316" height="88" rx="38" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="1120" y="1506" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Epílogo Flesh</text>
<rect x="102" y="1646" width="316" height="88" rx="38" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="260" y="1686" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Quebrar cadeia: preservar corpo e</text>
<text x="260" y="1706" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">seguir Hollow</text>
