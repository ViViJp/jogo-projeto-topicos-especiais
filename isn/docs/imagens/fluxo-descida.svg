<text x="690" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Percorrer setor / procurar</text>
<text x="690" y="376" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">memória</text>
<polygon points="690,484 848,550 690,616 532,550" fill="#edf4fc" stroke="#315b85" stroke-width="2"/>
<text x="690" y="556" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10253f">Recuperou memória?</text>
