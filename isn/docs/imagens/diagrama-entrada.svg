<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1140" viewBox="0 0 1540 1140" role="img" aria-labelledby="title desc">
<title id="title">Entrada por teclado e gamepad físico</title>
<desc id="desc">Diagrama gerado da mesma fonte do bloco Mermaid. Laranja e tracejado indicam propostas ou decisões pendentes.</desc>
